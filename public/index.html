<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=4" />
    <title>유병재 리즈시절 모자이크 그래픽</title>
    <link rel="icon" type="image/png" href="/static/favicon.png?v=9" />
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png?v=9" />
    <link rel="stylesheet" href="/static/style.css?v=22" />
  </head>
  <body>
    <header id="page-header">
      <h1 id="page-title">유병재 리즈</h1>
      <span id="page-subtitle">PHOTO MOSAIC</span>
      <a id="github-link" href="https://github.com/sksms17456/YooByeongjae-draw" target="_blank" rel="noopener" aria-label="GitHub 저장소">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
          <path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.1.79-.25.79-.56 0-.28-.01-1.02-.02-2-3.2.69-3.87-1.54-3.87-1.54-.52-1.32-1.27-1.67-1.27-1.67-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.02 1.75 2.69 1.25 3.34.95.1-.74.4-1.25.72-1.54-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.29 1.18-3.1-.12-.29-.51-1.46.11-3.05 0 0 .96-.31 3.15 1.18.91-.25 1.89-.38 2.86-.38.97 0 1.95.13 2.86.38 2.18-1.49 3.14-1.18 3.14-1.18.62 1.59.23 2.76.11 3.05.74.81 1.18 1.84 1.18 3.1 0 4.42-2.69 5.4-5.26 5.68.41.36.78 1.06.78 2.14 0 1.55-.01 2.8-.01 3.18 0 .31.21.67.8.55C20.21 21.39 23.5 17.07 23.5 12 23.5 5.65 18.35.5 12 .5z"/>
        </svg>
      </a>
    </header>
    <div id="targets-wrap">
      <button id="scroll-left" class="scroll-btn" type="button" aria-label="이전 타겟">‹</button>
      <nav id="targets-bar" aria-label="타겟 선택"></nav>
      <button id="scroll-right" class="scroll-btn" type="button" aria-label="다음 타겟">›</button>
    </div>

    <main id="stage">
      <div id="original-pane" aria-label="원본 이미지">
        <span class="pane-label">Original</span>
        <img id="original-img" alt="원본 타겟" />
        <div class="empty-state" aria-live="polite">원하는 리즈시절을 고르세요!</div>
      </div>
      <div id="mosaic-container" role="application" aria-label="모자이크 캔버스">
        <span class="pane-label">Mosaic</span>
        <div id="mosaic-viewport">
          <canvas id="mosaic-canvas" aria-hidden="true"></canvas>
        </div>
      </div>
      <div id="hint" class="hint">
        상단의 타겟을 클릭하세요. Ctrl+휠 또는 핀치줌으로 모자이크를 확대하면 타일 사진이 보입니다.
      </div>
    </main>

    <script src="/static/app.js?v=24"></script>
  </body>
</html>
