<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=4" />
    <title>유병재 리즈시절 모자이크 그래픽</title>
    <link rel="icon" type="image/png" href="/static/favicon.png?v=9" />
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png?v=9" />
    <link rel="stylesheet" href="/static/style.css?v=21" />
  </head>
  <body>
    <header id="page-header">
      <h1 id="page-title">유병재 리즈</h1>
      <span id="page-subtitle">PHOTO MOSAIC</span>
    </header>
    <div id="targets-wrap">
      <button id="scroll-left" class="scroll-btn" type="button" aria-label="이전 타겟">‹</button>
      <nav id="targets-bar" aria-label="타겟 선택"></nav>
      <button id="scroll-right" class="scroll-btn" type="button" aria-label="다음 타겟">›</button>
    </div>

    <main id="stage">
      <div id="original-pane" aria-label="원본 이미지">
        <span class="pane-label">Original</span>
        <img id="original-img" alt="원본 타겟" />
        <div class="empty-state" aria-live="polite">원하는 리즈시절을 고르세요!</div>
      </div>
      <div id="mosaic-container" role="application" aria-label="모자이크 캔버스">
        <span class="pane-label">Mosaic</span>
        <div id="mosaic-viewport">
          <canvas id="mosaic-canvas" aria-hidden="true"></canvas>
        </div>
      </div>
      <div id="hint" class="hint">
        상단의 타겟을 클릭하세요. Ctrl+휠 또는 핀치줌으로 모자이크를 확대하면 타일 사진이 보입니다.
      </div>
    </main>

    <script src="/static/app.js?v=24"></script>
  </body>
</html>
